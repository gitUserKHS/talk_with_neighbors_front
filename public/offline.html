<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#C84335" />
    <meta name="robots" content="noindex" />
    <title>오프라인 | 이웃톡</title>
    <!-- 서비스 워커가 네트워크 없이 보여주는 페이지다. 외부 자산을 참조하면 그것부터 실패하므로 모두 인라인으로 둔다. -->
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        box-sizing: border-box;
        padding: 24px;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
        background: #ffffff;
        color: #1f1f1f;
        text-align: center;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #121212;
          color: #f2f2f2;
        }
      }
      main {
        max-width: 420px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.5rem;
      }
      p {
        margin: 0 0 8px;
        line-height: 1.5;
      }
      .en {
        opacity: 0.75;
      }
      button {
        margin-top: 24px;
        padding: 12px 24px;
        border: 0;
        border-radius: 999px;
        background: #C84335;
        color: #ffffff;
        font: inherit;
        font-size: 1rem;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 3px solid #C84335;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>오프라인 상태예요</h1>
      <p>인터넷에 연결되면 이웃톡을 다시 불러올 수 있어요.</p>
      <p class="en" lang="en">You are offline. Neighbor Talk will load again once you are back online.</p>
      <button type="button" id="retry">다시 시도 <span lang="en">/ Retry</span></button>
    </main>
    <script>
      document.getElementById('retry').addEventListener('click', function () {
        window.location.reload();
      });
    </script>
  </body>
</html>
