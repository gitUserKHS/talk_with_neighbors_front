version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      react-ui:
        applies-to: version-updates
        patterns:
          - react
          - react-dom
          - react-router-dom
          - "@types/react*"
          - "@mui/*"
          - "@emotion/*"
        update-types: [minor, patch]
      redux:
        applies-to: version-updates
        patterns:
          - "@reduxjs/*"
          - react-redux
        update-types: [minor, patch]
      build-tools:
        applies-to: version-updates
        patterns:
          - vite
          - "@vitejs/*"
          - typescript
          - "@types/node"
        update-types: [minor, patch]
    ignore:
      - dependency-name: typescript
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]
