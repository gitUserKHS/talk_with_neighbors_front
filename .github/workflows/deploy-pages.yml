name: Manual frontend preview on GitHub Pages

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: Public HTTPS backend API base URL (for example, https://api.example.com/api)
        required: true
        type: string
      socket_url:
        description: Public HTTPS backend origin for WebSocket/SockJS
        required: true
        type: string

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: npm
      - name: Validate public backend inputs
        env:
          API_URL: ${{ inputs.api_url }}
          SOCKET_URL: ${{ inputs.socket_url }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$API_URL" =~ ^https://[^/[:space:]]+/api/?$ ]] || { echo "api_url must be an HTTPS /api URL" >&2; exit 1; }
          [[ "$SOCKET_URL" =~ ^https://[^/[:space:]]+$ ]] || { echo "socket_url must be an HTTPS origin without a path" >&2; exit 1; }
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
        env:
          VITE_API_URL: ${{ inputs.api_url }}
          VITE_SOCKET_URL: ${{ inputs.socket_url }}
          VITE_BASE_PATH: /talk_with_neighbors_front/
          VITE_KAKAO_MAP_API_KEY: ${{ secrets.VITE_KAKAO_MAP_API_KEY }}
      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
