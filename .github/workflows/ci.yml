name: Frontend CI

on:
  pull_request:
  push:
    branches: [main, "codex/**", "agent/**"]

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Run unit tests
        run: npm test
      - name: Run TypeScript type check
        run: npm run typecheck
      - name: Build same-origin production bundle
        run: npm run build
        env:
          VITE_API_URL: /api
          VITE_SOCKET_URL: ""
          VITE_BASE_PATH: /
          VITE_KAKAO_MAP_JAVASCRIPT_KEY: ""
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Build production container
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          # 스캔과 스모크 테스트가 이미지를 직접 실행하므로 러너의 데몬으로 내보낸다.
          load: true
          tags: talk-with-neighbors-frontend:ci
          build-args: |
            VITE_API_URL=/api
            VITE_SOCKET_URL=
            VITE_BASE_PATH=/
            VITE_KAKAO_MAP_JAVASCRIPT_KEY=
          cache-from: type=gha,scope=frontend-ci
          cache-to: type=gha,mode=max,scope=frontend-ci
      - name: Scan container for fixable high-severity vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: talk-with-neighbors-frontend:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
      - name: Smoke-test production container
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker rm -f talk-with-neighbors-frontend-ci >/dev/null 2>&1 || true' EXIT
          docker run --detach --name talk-with-neighbors-frontend-ci \
            --add-host backend:127.0.0.1 \
            --publish 127.0.0.1:8081:80 \
            talk-with-neighbors-frontend:ci

          for _ in {1..15}; do
            if curl --fail --silent --show-error http://127.0.0.1:8081/healthz | grep --quiet '^ok$'; then
              curl --fail --silent --show-error http://127.0.0.1:8081/ | grep --ignore-case --quiet '<!doctype html>'
              bash scripts/assert-nginx-security-headers.sh http://127.0.0.1:8081
              exit 0
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' talk-with-neighbors-frontend-ci)" != "true" ]; then
              docker logs talk-with-neighbors-frontend-ci
              exit 1
            fi
            sleep 1
          done

          docker logs talk-with-neighbors-frontend-ci
          exit 1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-dist
          path: dist
          if-no-files-found: error
          retention-days: 7
