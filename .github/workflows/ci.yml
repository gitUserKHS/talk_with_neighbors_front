name: Frontend CI

on:
  pull_request:
  push:
    branches: [main, "codex/**"]

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Build production container
        run: docker build --build-arg VITE_API_URL=/api --build-arg VITE_SOCKET_URL= -t talk-with-neighbors-frontend:ci .
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: dist
          if-no-files-found: error
          retention-days: 7
